[project]
name = "jusr-ai-helpers"
version = "0.1.0"
description = "Jusr AI: AI helper service. Suggests only; a person decides."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "pydantic>=2", "uvicorn>=0.29", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "python-multipart>=0.0.9"]
llm = ["anthropic>=0.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "config*"]